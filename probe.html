<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Storage probe</title>
</head>
<body>
<h1>Storage probe</h1>
<pre id="out">running</pre>
<script>
const out = document.getElementById("out");
const lines = [];
function say(s) { lines.push(s); out.textContent = lines.join("\n"); }
async function f(url, opt = {}) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), 9000);
  try { return await fetch(url, { ...opt, signal: c.signal, cache: "no-store" }); } finally { clearTimeout(t); }
}
const J = { "Content-Type": "application/json", Accept: "application/json" };
const uid = "rw" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
const tests = {
  async jsonblob_get() { const r = await f("https://jsonblob.com/api/jsonBlob/1"); return "HTTP " + r.status; },
  async jsonblob_post_plain() {
    const r = await f("https://jsonblob.com/api/jsonBlob", { method: "POST", headers: { "Content-Type": "text/plain" }, body: '{"a":1}' });
    return "HTTP " + r.status + " loc=" + r.headers.get("Location") + " x=" + r.headers.get("x-jsonblob");
  },
  async restful_api_dev() {
    let r = await f("https://api.restful-api.dev/objects", { method: "POST", headers: J, body: JSON.stringify({ name: "wishlist-probe", data: { purchased: {} } }) });
    if (!r.ok) throw new Error("create HTTP " + r.status + " " + (await r.text()).slice(0, 120));
    const j = await r.json(); const id = j.id;
    r = await f("https://api.restful-api.dev/objects/" + id, { method: "PUT", headers: J, body: JSON.stringify({ name: "wishlist-probe", data: { purchased: { x: true } } }) });
    if (!r.ok) throw new Error("put HTTP " + r.status + " " + (await r.text()).slice(0, 120));
    r = await f("https://api.restful-api.dev/objects/" + id);
    const g = await r.json();
    return "id=" + id + " readback=" + JSON.stringify(g.data);
  },
  async textdb() {
    const u = "https://textdb.dev/api/data/" + uid;
    let r = await f(u, { method: "POST", headers: { "Content-Type": "text/plain" }, body: '{"x":true}' });
    if (!r.ok) throw new Error("post HTTP " + r.status);
    r = await f(u); return "HTTP " + r.status + " readback=" + (await r.text()).slice(0, 60);
  },
  async abacus() {
    let r = await f("https://abacus.jasoncameron.dev/hit/" + uid + "/t1");
    if (!r.ok) throw new Error("hit HTTP " + r.status);
    const a = await r.json();
    r = await f("https://abacus.jasoncameron.dev/get/" + uid + "/t1");
    return "hit=" + JSON.stringify(a) + " get=" + (await r.text()).slice(0, 80);
  },
  async abacus_create_set() {
    let r = await f("https://abacus.jasoncameron.dev/create/" + uid + "/mask");
    const txt = await r.text();
    if (!r.ok) throw new Error("create HTTP " + r.status + " " + txt.slice(0, 100));
    const j = JSON.parse(txt); const key = j.admin_key;
    r = await f("https://abacus.jasoncameron.dev/set/" + uid + "/mask?value=1073741829", { method: "POST", headers: { Authorization: "Bearer " + key } });
    const s = await r.text();
    r = await f("https://abacus.jasoncameron.dev/get/" + uid + "/mask");
    return "create keys=" + Object.keys(j).join(",") + " set=HTTP " + s.slice(0, 80) + " get=" + (await r.text()).slice(0, 80);
  },
  async counterapi() {
    let r = await f("https://api.counterapi.dev/v1/" + uid + "/t1/up");
    if (!r.ok) throw new Error("up HTTP " + r.status);
    const a = await r.text();
    r = await f("https://api.counterapi.dev/v1/" + uid + "/t1/set?count=12345");
    const s = "set HTTP " + r.status + " " + (await r.text()).slice(0, 80);
    r = await f("https://api.counterapi.dev/v1/" + uid + "/t1/");
    return "up=" + a.slice(0, 80) + " | " + s + " | get=" + (await r.text()).slice(0, 80);
  },
  async keyvalue_immanuel() {
    let r = await f("https://keyvalue.immanuel.co/api/KeyVal/GetAppKey");
    if (!r.ok) throw new Error("appkey HTTP " + r.status);
    const k = JSON.parse(await r.text());
    r = await f("https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/" + k + "/probe/abc123", { method: "POST" });
    const u = "update HTTP " + r.status;
    r = await f("https://keyvalue.immanuel.co/api/KeyVal/GetValue/" + k + "/probe");
    return "key=" + k + " " + u + " get=" + (await r.text()).slice(0, 60);
  },
  async kvdb_ping() { const r = await f("https://kvdb.io/"); return "HTTP " + r.status; },
  async pantry_ping() { const r = await f("https://getpantry.cloud/apiv1/pantry/00000000-0000-0000-0000-000000000000"); return "HTTP " + r.status + " " + (await r.text()).slice(0, 60); },
};
(async () => {
  lines.length = 0;
  await Promise.all(Object.entries(tests).map(async ([name, fn]) => {
    try { say(name + ": OK " + await fn()); } catch (e) { say(name + ": FAIL " + (e && e.message || e)); }
  }));
  say("PROBE-DONE");
})();
</script>
</body>
</html>
