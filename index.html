<style>
/* One dark theme by choice. Layout: left-aligned header, price-range sections, card grid. */
:root {
  color-scheme: dark;
  --bg: #090d18;
  --card: #121829;
  --edge: #263049;
  --text: #f5f7fc;
  --muted: #8f9bb6;
  --soft: #c9d4ee;
  --red: #ff5a6a;
  --gold: #ffcf6b;
  --green: #3ddc97;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  background-image:
    radial-gradient(520px 420px at 8% 0%, rgba(255, 70, 95, .22), transparent 70%),
    radial-gradient(480px 420px at 96% 12%, rgba(40, 215, 140, .16), transparent 70%);
  background-repeat: no-repeat;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; }

header { position: relative; padding: 18px 0 8px; }
.pill {
  display: inline-block; font-size: 11px; font-weight: 500; letter-spacing: .22em; color: var(--gold);
  border: 1px solid rgba(255, 207, 107, .6); border-radius: 999px; padding: 6px 14px;
}
h1 { margin: 18px 0 0; font-weight: 700; line-height: .98; font-size: clamp(44px, 11vw, 84px); letter-spacing: -.02em; }
h1 .grad {
  display: block; background: linear-gradient(90deg, var(--red), var(--gold));
  -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .12em;
}
.tree { position: absolute; right: 4px; top: 30px; width: clamp(64px, 14vw, 104px); height: auto; }
.meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft);
  background: rgba(255, 255, 255, .05); border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px;
}
.starbadge {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  background: #05070d; color: var(--gold); font-size: 13px; line-height: 1; border: 1px solid rgba(255, 207, 107, .5);
}
button.chip { font: inherit; font-size: 13px; cursor: pointer; }
.chip[hidden] { display: none; }
button.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.notice {
  margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 13px; color: var(--soft);
  border: 1px dashed var(--edge); background: rgba(255, 255, 255, .03);
}
.notice[hidden] { display: none; }

section { margin-top: 44px; }
.sechead { display: flex; align-items: baseline; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--edge); }
.sechead h2 { margin: 0; font-size: 24px; font-weight: 700; padding-left: 14px; border-left: 4px solid var(--c, var(--red)); line-height: 1.1; }
.sechead span { margin-left: auto; font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 18px; }

.card {
  position: relative; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--edge);
  border-radius: 18px; padding: 8px; box-shadow: 0 6px 0 rgba(0, 0, 0, .28);
}
.photo { position: relative; display: block; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 10; }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 8px; }
.tile { display: grid; place-items: center; text-align: center; width: 100%; height: 100%; color: #fff; }
.tile b { display: block; font-size: 34px; font-weight: 700; }
.tile small { font-size: 12px; opacity: .9; }
.tile.claude { background: #d97757; } .tile.runpod { background: #5d3fd3; }
.rank {
  position: absolute; left: 10px; top: 10px; font-size: 11px; font-weight: 700; color: #fff;
  background: rgba(9, 13, 24, .88); border-radius: 999px; padding: 3px 9px; font-variant-numeric: tabular-nums;
}
.photo .starbadge { position: absolute; right: 10px; top: 10px; width: 30px; height: 30px; font-size: 16px; }
.body { display: flex; flex-direction: column; gap: 4px; padding: 14px 8px 8px; flex: 1; }
.name { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.25; }
.desc { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.row { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 12px; }
.price { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.price small { font-size: 11.5px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.store {
  margin-left: auto; font-size: 12.5px; font-weight: 500; color: var(--soft); text-decoration: none; white-space: nowrap;
  border: 1px solid #33405e; background: rgba(255, 255, 255, .06); border-radius: 999px; padding: 7px 13px;
}
.store b { color: var(--gold); font-weight: 600; }
.buy {
  margin-top: 10px; width: 100%; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  color: #06140e; background: var(--green); border: 0; border-radius: 12px; padding: 12px 14px; min-height: 46px;
}
.buy.confirm { background: var(--gold); }
.buy.done { background: transparent; color: var(--green); border: 1px solid rgba(61, 220, 151, .55); }
.buy:disabled { opacity: .45; cursor: not-allowed; }
.buy[hidden] { display: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.card.bought .photo, .card.bought .name, .card.bought .desc, .card.bought .price { opacity: .38; }
.card.bought .name { text-decoration: line-through; }
.ribbon {
  position: absolute; right: -1px; top: 54px; z-index: 2; font-size: 11px; font-weight: 700; letter-spacing: .14em;
  color: #06140e; background: var(--green); padding: 6px 12px 6px 14px; border-radius: 8px 0 0 8px;
}
.ribbon[hidden] { display: none; }
body.hide-bought .card.bought { display: none; }

footer { margin-top: 60px; padding-top: 26px; border-top: 1px solid var(--edge); text-align: center; }
footer h3 { margin: 0; font-size: 28px; font-weight: 700; }
footer p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
footer .fine { font-size: 11.5px; margin-top: 18px; }
footer button.chip { margin-top: 18px; }
@media (max-width: 420px) { .tree { top: 64px; } }
@media (prefers-reduced-motion: no-preference) { .buy, .card { transition: opacity .2s, background-color .2s; } }
</style>
</head>

  ["$100 and up", "#ff5a6a", p => p !== null && p >= 100],
  ["$50 to $100", "#ffcf6b", p => p !== null && p >= 50 && p < 100],
  ["$25 to $50", "#3ddc97", p => p !== null && p >= 25 && p < 50],
  ["Under $25", "#5db7ff", p => p !== null && p < 25],
  ["Any amount", "#b08cff", p => p === null],
];
const BACKEND = (window.WISHLIST_CONFIG && window.WISHLIST_CONFIG.backendUrl || "").trim();
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let purchased = {};               // id -> true
let ryanMode = store.get("ryanMode") === "1";
let loaded = false;
const busy = new Set();
const cards = {};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
const money = p => p === null ? "N/A" : "$" + p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function build() {
  const list = document.getElementById("list");
  let rank = 0;
  for (const [label, color, test] of RANGES) {
    const its = ITEMS.filter(i => test(i.price));
    if (!its.length) continue;
    const sec = el("section");
    const head = el("div", "sechead");
    const h2 = el("h2", "", label); h2.style.setProperty("--c", color);
    head.append(h2, el("span", "", its.length + (its.length === 1 ? " gift" : " gifts")));
    const grid = el("div", "grid");
    for (const it of its) {
      rank++;
      const card = el("article", "card");
      const photo = el(it.url ? "a" : "div", "photo");
      if (it.url) { photo.href = it.url; photo.target = "_blank"; photo.rel = "noopener"; photo.setAttribute("aria-label", it.name + " on " + it.store); }
      if (it.img) {
        photo.style.background = it.bg;
        const im = el("img"); im.src = it.img; im.alt = it.name; im.loading = "lazy"; im.width = it.w; im.height = it.h;
        photo.append(im);
      } else {
        const t = el("div", "tile " + it.tile);
        const inner = el("div");
        inner.append(el("b", "", it.tile === "claude" ? "Claude" : "Runpod"), el("small", "", it.tile === "claude" ? "one month" : "credits"));
        t.append(inner); photo.append(t);
      }
      photo.append(el("span", "rank", String(rank).padStart(2, "0")));
      if (it.star) { const s = el("span", "starbadge", "★"); s.title = "Most wanted"; photo.append(s); }
      const ribbon = el("span", "ribbon", "PURCHASED"); ribbon.hidden = true;
      const body = el("div", "body");
      const row = el("div", "row");
      const price = el("span", "price", money(it.price));
      if (it.monthly) price.append(el("small", "", "for one month"));
      row.append(price);
      if (it.url) {
        const a = el("a", "store"); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
        a.append(document.createTextNode(it.store + " "), el("b", "", "↗"));
        row.append(a);
      }
      const btn = el("button", "buy", "Mark as purchased"); btn.type = "button"; btn.id = "buy-" + it.id;
      btn.addEventListener("click", () => onBuy(it.id));
      body.append(el("h3", "name", it.name), el("p", "desc", it.desc), row, btn);
      card.append(photo, ribbon, body);
      grid.append(card);
      cards[it.id] = { card, btn, ribbon, armed: null };
    }
    sec.append(head, grid);
    list.append(sec);
  }
}

function render() {
  const showState = BACKEND && loaded && !ryanMode;
  let n = 0;
  for (const it of ITEMS) {
    const c = cards[it.id];
    const got = !!purchased[it.id];
    if (got) n++;
    c.card.classList.toggle("bought", showState && got);
    c.ribbon.hidden = !(showState && got);
    c.btn.hidden = ryanMode;
    c.btn.disabled = !BACKEND || !loaded || busy.has(it.id);
    c.btn.classList.toggle("done", showState && got && !c.armed);
    c.btn.classList.toggle("confirm", !!c.armed);
    c.btn.textContent = busy.has(it.id) ? "Saving…"
      : c.armed ? (got ? "Tap again to undo" : "Tap again to confirm")
      : (showState && got) ? "Purchased ✓  (tap to undo)" : "Mark as purchased";
  }
  const count = document.getElementById("count");
  count.hidden = !showState;
  count.textContent = n + " of " + ITEMS.length + " purchased";
  const hb = document.getElementById("hideBought");
  hb.hidden = !showState;
  document.body.classList.toggle("hide-bought", showState && hb.getAttribute("aria-pressed") === "true");
  const rm = document.getElementById("ryanMode");
  rm.setAttribute("aria-pressed", String(ryanMode));
  rm.textContent = ryanMode ? "Ryan mode is on: purchases are hidden (tap to turn off)" : "I’m Ryan: hide what’s been bought";
}

function note(msg) {
  const n = document.getElementById("notice");
  n.hidden = !msg; n.textContent = msg || "";
}

async function refresh() {
  if (!BACKEND) return;
  try {
    const r = await fetch(BACKEND + "?t=" + Date.now(), { redirect: "follow" });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "bad response");
    purchased = j.purchased || {};
    loaded = true; note("");
  } catch (e) {
    if (!loaded) note("Couldn’t load what’s been purchased. Check your connection and reload the page.");
  }
  render();
}

async function onBuy(id) {
  const c = cards[id];
  if (!c.armed) {                                   // first tap arms, second tap confirms
    c.armed = setTimeout(() => { c.armed = null; render(); }, 4000);
    return render();
  }
  clearTimeout(c.armed); c.armed = null;
  const want = !purchased[id];
  busy.add(id); render();
  try {
    const r = await fetch(BACKEND, {
      method: "POST", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ id, purchased: want }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "bad response");
    purchased = j.purchased || {};
    note("");
  } catch (e) {
    note("That didn’t save. Check your connection and try again.");
  }
  busy.delete(id); render();
}

build();
document.getElementById("hideBought").addEventListener("click", e => {
  const b = e.currentTarget; b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); render();
});
document.getElementById("ryanMode").addEventListener("click", () => {
  ryanMode = !ryanMode; store.set("ryanMode", ryanMode ? "1" : "0"); render();
});
if (!BACKEND) note("Purchase tracking isn’t connected yet, so the “Mark as purchased” buttons are off for now.");
render();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
